<header class="page-header">
  <div>
    @if (eyebrow) {
      <p class="page-header__eyebrow">{{ eyebrow }}</p>
    }

    <h1>{{ title }}</h1>

    @if (description) {
      <p class="page-header__description">{{ description }}</p>
    }
  </div>

  <div class="page-header__actions">
    <ng-content select="[pageHeaderActions]" />
  </div>
</header>
