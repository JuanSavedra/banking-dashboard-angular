<a class="app-skip-link" href="#main-content">Pular para conteúdo principal</a>

<div class="app-layout">
  <aside
    id="app-sidebar"
    class="app-sidebar"
    [class.app-sidebar--open]="menuOpen()"
    [attr.aria-hidden]="sidebarHiddenFromKeyboard() ? 'true' : null"
    aria-label="Navegação principal"
    [attr.inert]="sidebarHiddenFromKeyboard() ? '' : null"
  >
    <div class="app-sidebar__brand">
      <div>
        <strong>{{ productName }}</strong>
      </div>
    </div>

    <nav class="app-sidebar__nav" aria-label="Áreas do dashboard">
      @for (item of navigationItems; track item.route) {
        <a
          #activeLink="routerLinkActive"
          [routerLink]="item.route"
          routerLinkActive="app-sidebar__item--active"
          [routerLinkActiveOptions]="{ exact: item.route !== '/app/beneficiaries' }"
          [attr.aria-current]="activeLink.isActive ? 'page' : null"
          (click)="closeMenu()"
        >
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="app-surface">
    <header class="app-topbar">
      <button
        mat-icon-button
        type="button"
        class="app-topbar__menu"
        aria-label="Alternar navegação"
        aria-controls="app-sidebar"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>

      <div>
        <strong>Olá, {{ user()?.name ?? 'cliente' }}</strong>
        <span>{{ user()?.accountLabel ?? 'Conta digital' }}</span>
      </div>

      <div class="app-topbar__actions">
        <button mat-button type="button" (click)="logout()">
          <mat-icon aria-hidden="true">logout</mat-icon>
          Sair
        </button>
      </div>
    </header>

    <main id="main-content" class="app-content" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
