<app-page-header
  eyebrow="Dashboard"
  title="Visão financeira"
  description="Resumo financeiro e movimentações recentes da conta."
>
  <a pageHeaderActions mat-flat-button routerLink="/app/transfers">
    <mat-icon aria-hidden="true">add</mat-icon>
    Nova transferência
  </a>
</app-page-header>

@if (loading()) {
  <app-loading-state label="Carregando dashboard" [rows]="5" />
} @else if (error()) {
  <app-error-state
    title="Não foi possível carregar o dashboard"
    description="Tente novamente em instantes."
    actionLabel="Recarregar dashboard"
    (action)="loadDashboard()"
  />
} @else if (!account()) {
  <app-empty-state
    icon="account_balance"
    title="Conta não encontrada"
    description="Nenhum dado de conta encontrado para o usuário autenticado."
  />
} @else {
  <section class="summary-grid" aria-label="Resumo financeiro">
    @for (summary of summaries(); track summary.label) {
      <app-summary-card
        [label]="summary.label"
        [value]="summary.value"
        [description]="summary.description"
        [icon]="summary.icon"
        [tone]="summary.tone"
      />
    }
  </section>

  <section class="dashboard-grid" aria-label="Dashboard financeiro">
    <app-recent-transactions [activities]="activities()" />

    <aside class="dashboard-sidebar">
      <app-spending-chart
        [income]="account()!.incomeThisMonth"
        [outcome]="account()!.outcomeThisMonth"
      />
      <app-quick-actions />
    </aside>
  </section>
}
